<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="450" version="1.1" viewBox="0 0 1200 450" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
 <metadata>
  <c2pa:manifest></c2pa:manifest>
 </metadata>
 <defs>
  <filter id="wobble" x="-.0012712" y="-.0034884" width="1.0025" height="1.007">
   <feTurbulence baseFrequency="0.03" numOctaves="2" result="n" seed="7" type="fractalNoise"/>
   <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
  </filter>
  <style>.ink { fill: none; stroke: #111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #111; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .fillw { fill: #fff; stroke: #111; stroke-width: 2.5; stroke-linejoin: round; }
      text { font-family: 'Humor Sans', 'xkcd Script', 'Comic Neue', 'Comic Sans MS', cursive; fill: #111; text-anchor: middle; }
      .t { font-size: 20px; }
      .s { font-size: 15px; }
      .h { font-size: 22px; font-weight: bold; }</style>
 </defs>
 <rect width="1200" height="450" fill="#fff"/>
 <g filter="url(#wobble)">
  <!-- Panel frames -->
  <rect class="ink" x="10" y="10" width="380" height="430"/>
  <rect class="ink" x="410" y="10" width="380" height="430"/>
  <rect class="ink" x="810" y="10" width="380" height="430"/>
  <!-- ===== PANEL 1: 1990s ===== -->
  <text class="h" x="200" y="42">THE 1990s</text>
  <!-- speech bubble -->
  <rect class="fillw" x="30" y="58" width="270" height="72" rx="30"/>
  <path class="thin" d="m110 130 5 132"/>
  <text class="t" x="165" y="88">Here are some powers.</text>
  <text class="t" x="165" y="114">Try not to screw it up.</text>
  <!-- ground + cliff -->
  <path class="ink" d="m10 380h290l6 60"/>
  <path class="thin" d="m300 380 6 10m-3 10-5 8"/>
  <text class="s" x="345" y="410">(cliff)</text>
  <!-- giver -->
  <circle class="ink" cx="110" cy="280" r="14"/>
  <path class="ink" d="m110 294v46l-15 40m15-40 15 40m-15-75 40-5m-40 10 40 2"/>
  <!-- box of powers -->
  <rect class="fillw" x="150" y="285" width="42" height="35"/>
  <path class="thin" d="m174 290-10 13h9l-10 13"/>
  <text class="s" x="171" y="340">POWERS</text>
  <text class="s" x="171" y="356">(no manual)</text>
  <!-- receiver -->
  <circle class="ink" cx="232" cy="280" r="14"/>
  <path class="ink" d="m232 294v46l-15 40m15-40 15 40m-15-75-40-5m40 10-40 2"/>
  <!-- ===== PANEL 2: TODAY ===== -->
  <text class="h" x="600" y="42">TODAY</text>
  <rect class="fillw" x="425" y="58" width="260" height="72" rx="30"/>
  <path class="thin" d="m500 130 12 128"/>
  <text class="t" x="555" y="88">You probably shouldn't</text>
  <text class="t" x="555" y="114">be allowed to.</text>
  <!-- clerk behind desk -->
  <circle class="ink" cx="512" cy="275" r="14"/>
  <path class="ink" d="m512 289v31m0-20-22 12 15 6m7-18 23 12-15 6"/>
  <!-- desk -->
  <rect class="fillw" x="440" y="320" width="155" height="45"/>
  <path class="ink" d="m448 365v15m139-15v15"/>
  <text class="s" x="517" y="348">DEPT. OF NO</text>
  <!-- paper stack -->
  <g class="thin">
   <path d="m548 320h40v-130h-40z" fill="#fff"/>
   <path d="m548 306h40m-40-14h40m-40-14h40m-40-14h40m-40-14h40m-40-14h40m-40-14h40m-40-14h40"/>
   <path d="m552 190 4-14 36 2-4 12"/>
  </g>
  <text class="s" x="568" y="170">FORMS</text>
  <!-- ground -->
  <path class="ink" d="m410 380h380"/>
  <!-- small person -->
  <circle class="ink" cx="712" cy="282" r="13"/>
  <path class="ink" d="m712 295v43l-13 42m13-42 13 42m-13-74-14 22m14-22 14 22"/>
  <rect class="fillw" x="632" y="172" width="150" height="62" rx="24"/>
  <path class="thin" d="m705 234 6 32"/>
  <text class="s" x="707" y="198">...but I haven't</text>
  <text class="s" x="707" y="218">even asked yet.</text>
  <!-- ===== PANEL 3: THE WAY OUT ===== -->
  <text class="h" x="1000" y="42">WHAT GETS US OUT</text>
  <text class="t" x="1000" y="82">"Here's a funded road,</text>
  <text class="t" x="1000" y="108">and yes is the default."</text>
  <!-- horizon + hills -->
  <path class="thin" d="m810 215q50-25 100 0m170 0q50-30 110 0m-280 0h170"/>
  <!-- road -->
  <path class="ink" d="m840 440 145-225m175 225-145-225"/>
  <path class="thin" d="m1e3 438v-213" stroke-dasharray="12 12"/>
  <!-- YES sign -->
  <path class="ink" d="m860 290v105"/>
  <rect class="fillw" x="818" y="245" width="84" height="45"/>
  <text class="h" x="860" y="272">YES</text>
  <text class="s" x="860" y="286" font-size="11px">(default)</text>
  <!-- money bag -->
  <path class="fillw" d="m1140 368q-12 27 10 32 22-5 10-32z"/>
  <path class="thin" d="m1142 366h16m-14-4h12"/>
  <text class="s" x="1150" y="392">$</text>
  <text class="s" x="1150" y="420">FUNDED</text>
  <!-- happy walker -->
  <circle class="ink" cx="1028" cy="300" r="12"/>
  <path class="ink" d="m1028 312v38l-12 35m12-35 14 32m-14-60-18-20m18 20 18-20"/>
  <path class="thin" d="m1060 330h15m-17 15h12m-8 15h14"/>
  <text class="s" x="1070" y="270">wait, really?!</text>
 </g>
</svg>
